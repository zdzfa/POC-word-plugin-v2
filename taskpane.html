<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audit IA Copilot</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        /* ============================================
           DESIGN SYSTEM — Fluent UI / Copilot Style
           ============================================ */
        :root {
            --primary: #7B2FF2;
            --primary-light: #EDE4FF;
            --primary-dark: #5A1FBF;
            --primary-bg: #F6F1FF;
            --bg: #FAFAFA;
            --surface: #FFFFFF;
            --surface-hover: #F5F0FF;
            --text: #242424;
            --text-secondary: #616161;
            --text-muted: #9E9E9E;
            --border: #E0E0E0;
            --border-light: #F0F0F0;
            --success: #107C10;
            --success-bg: #DFF6DD;
            --warning: #FFB900;
            --warning-bg: #FFF4CE;
            --error: #D13438;
            --error-bg: #FDE7E9;
            --info: #0078D4;
            --info-bg: #D0E7F8;
            --radius: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
            --transition: 0.2s ease;
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
        }

        /* ---- App Shell ---- */
        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 14px 16px;
            flex-shrink: 0;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-brand svg {
            width: 22px;
            height: 22px;
            fill: white;
        }
        .header-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }
        .header-sub {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ---- Assistant Grid ---- */
        .view-grid { padding: 12px; }

        .grid-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            padding: 0 2px;
        }

        .assistants-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .assistant-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .assistant-card:hover {
            border-color: var(--primary);
            background: var(--surface-hover);
            box-shadow: var(--shadow-sm);
            transform: translateY(-1px);
        }
        .assistant-card .card-icon {
            font-size: 20px;
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .assistant-card .card-name {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }
        .assistant-card .card-desc {
            font-size: 10.5px;
            color: var(--text-muted);
            line-height: 1.3;
        }

        /* ---- Chat View ---- */
        .view-chat { display: none; flex-direction: column; height: 100%; }
        .view-chat.active { display: flex; }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border-light);
            background: var(--surface);
            flex-shrink: 0;
        }
        .chat-back {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            color: var(--text-secondary);
            font-size: 16px;
            display: flex;
            align-items: center;
        }
        .chat-back:hover { background: var(--border-light); }
        .chat-assistant-info {
            flex: 1;
            min-width: 0;
        }
        .chat-assistant-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-assistant-desc {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-clear-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 4px 10px;
            font-size: 11px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            font-family: var(--font);
        }
        .chat-clear-btn:hover {
            background: var(--border-light);
            border-color: var(--text-muted);
        }

        /* Messages area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 95%;
            animation: slideIn 0.25s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-user {
            align-self: flex-end;
        }
        .message-user .bubble {
            background: var(--primary);
            color: white;
            border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
            padding: 10px 14px;
            font-size: 12.5px;
        }
        .message-user .bubble .msg-label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .message-user .bubble .msg-selection {
            background: rgba(255,255,255,0.15);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 11.5px;
            margin: 4px 0;
            max-height: 80px;
            overflow: hidden;
            line-height: 1.4;
        }
        .message-user .bubble .msg-instructions {
            margin-top: 6px;
            font-style: italic;
            opacity: 0.9;
        }

        .message-ai {
            align-self: flex-start;
        }
        .message-ai .bubble {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px var(--radius-lg) var(--radius-lg) var(--radius-lg);
            padding: 12px 14px;
            font-size: 12.5px;
        }

        /* AI result content formatting */
        .result-content { line-height: 1.6; }
        .result-content h3 {
            font-size: 13px;
            margin: 10px 0 6px;
            color: var(--primary-dark);
        }
        .result-content h3:first-child { margin-top: 0; }
        .result-content p { margin: 4px 0; }
        .result-content ul, .result-content ol {
            padding-left: 18px;
            margin: 4px 0;
        }
        .result-content li { margin: 2px 0; }
        .result-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 11.5px;
        }
        .result-content table th {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
            text-align: left;
            padding: 6px 8px;
            border: 1px solid var(--border);
        }
        .result-content table td {
            padding: 5px 8px;
            border: 1px solid var(--border);
        }
        .result-content table tr:nth-child(even) td {
            background: #FAFAFA;
        }

        /* Diff formatting */
        .diff-del {
            background: #FECDD3;
            color: #9F1239;
            text-decoration: line-through;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .diff-ins {
            background: #BBF7D0;
            color: #166534;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 500;
        }

        /* Structured sections */
        .section-block {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin: 8px 0;
            overflow: hidden;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: #F8F8F8;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            gap: 6px;
        }
        .section-header:hover { background: #F0F0F0; }
        .section-header .badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
        }
        .badge-critical { background: var(--error); }
        .badge-major { background: #E97025; }
        .badge-moderate { background: var(--warning); color: #333; }
        .badge-minor { background: var(--info); }
        .badge-ok { background: var(--success); }
        .section-body {
            padding: 8px 10px;
            font-size: 12px;
            border-top: 1px solid var(--border);
        }

        /* Summary box */
        .exec-summary {
            background: var(--primary-bg);
            border: 1px solid #D4C4F0;
            border-radius: var(--radius);
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .exec-summary-title {
            font-weight: 700;
            font-size: 12px;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        /* Report layout */
        .report-meta {
            background: #F5F5F5;
            border-radius: var(--radius);
            padding: 8px 10px;
            margin-bottom: 10px;
            font-size: 11.5px;
        }
        .report-meta-row {
            display: flex;
            gap: 6px;
            padding: 2px 0;
        }
        .report-meta-label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 70px;
        }

        /* Annotation blocks */
        .annotation-block {
            border-left: 3px solid var(--info);
            background: var(--info-bg);
            padding: 8px 10px;
            margin: 6px 0;
            border-radius: 0 var(--radius) var(--radius) 0;
            font-size: 12px;
        }
        .annotation-block.improved {
            border-left-color: var(--success);
            background: var(--success-bg);
        }
        .annotation-label {
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        /* Score display */
        .score-display {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            margin: 6px 0;
        }
        .score-display .score-label {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        /* Message actions */
        .message-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border-light);
        }
        .msg-action-btn {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 11px;
            font-family: var(--font);
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all var(--transition);
        }
        .msg-action-btn:hover {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        /* Loading dots */
        .loading-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 14px;
            color: var(--text-muted);
            font-size: 12px;
        }
        .loading-dots {
            display: flex;
            gap: 4px;
        }
        .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: dotPulse 1.4s infinite ease-in-out;
        }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ---- Input Area ---- */
        .input-area {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 10px 14px 12px;
            flex-shrink: 0;
            display: none;
        }
        .input-area.active { display: block; }

        .selection-preview {
            background: var(--bg);
            border: 1px solid var(--border-light);
            border-radius: var(--radius);
            padding: 8px 10px;
            margin-bottom: 8px;
            font-size: 11px;
        }
        .selection-preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .selection-preview-label {
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .selection-stats {
            color: var(--text-muted);
            font-size: 10px;
        }
        .selection-text {
            color: var(--text);
            line-height: 1.4;
            max-height: 50px;
            overflow: hidden;
            position: relative;
        }
        .selection-text::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(transparent, var(--bg));
        }
        .selection-empty {
            color: var(--text-muted);
            font-style: italic;
        }

        .input-row {
            display: flex;
            gap: 6px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .input-wrapper textarea {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 10px;
            font-family: var(--font);
            font-size: 12.5px;
            resize: none;
            line-height: 1.4;
            min-height: 36px;
            max-height: 80px;
            color: var(--text);
            transition: border-color var(--transition);
        }
        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }
        .input-wrapper textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(123,47,242,0.12);
        }
        .send-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background var(--transition);
        }
        .send-btn:hover { background: var(--primary-dark); }
        .send-btn:disabled {
            background: var(--border);
            cursor: default;
        }
        .send-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* ---- Toast ---- */
        .toast-container {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            background: #333;
            color: white;
            padding: 8px 14px;
            border-radius: var(--radius);
            font-size: 12px;
            margin-bottom: 6px;
            animation: toastIn 0.25s ease, toastOut 0.3s ease 2.5s forwards;
            pointer-events: auto;
            box-shadow: var(--shadow-lg);
        }
        .toast.toast-success { background: var(--success); }
        .toast.toast-error { background: var(--error); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CCC; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #AAA; }

        /* ---- Utility ---- */
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="app">
    <!-- Header -->
    <div class="header">
        <div class="header-brand">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <div>
                <div class="header-title">Audit IA Copilot</div>
                <div class="header-sub">Assistants IA pour l'audit interne</div>
            </div>
        </div>
    </div>

    <!-- Main scrollable content -->
    <div class="main-content">
        <!-- Grid View (assistants selection) -->
        <div id="viewGrid" class="view-grid">
            <div class="grid-title">Choisissez un assistant</div>
            <div id="assistantsGrid" class="assistants-grid"></div>
        </div>

        <!-- Chat View -->
        <div id="viewChat" class="view-chat">
            <div class="chat-header">
                <button class="chat-back" id="btnBack" title="Retour">&#8592;</button>
                <div class="chat-assistant-info">
                    <div class="chat-assistant-name" id="chatAssistantName"></div>
                    <div class="chat-assistant-desc" id="chatAssistantDesc"></div>
                </div>
                <button class="chat-clear-btn" id="btnClear">Nouveau</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
        </div>
    </div>

    <!-- Input Area (visible in chat view) -->
    <div id="inputArea" class="input-area">
        <div class="selection-preview" id="selectionPreview">
            <div class="selection-preview-header">
                <span class="selection-preview-label">&#128196; Texte s&eacute;lectionn&eacute;</span>
                <span class="selection-stats" id="selectionStats"></span>
            </div>
            <div id="selectionContent" class="selection-empty">
                S&eacute;lectionnez du texte dans Word...
            </div>
        </div>
        <div class="input-row">
            <div class="input-wrapper">
                <textarea id="inputText" placeholder="Instructions suppl&eacute;mentaires (optionnel)..." rows="1"></textarea>
            </div>
            <button class="send-btn" id="btnSend" title="Envoyer" disabled>
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* =============================================================
   AUDIT IA COPILOT — Application JavaScript
   ============================================================= */

// ── CONFIG ──────────────────────────────────────────────────
var CONFIG = {
    useMock: true,
    apiEndpoint: 'https://YOUR_API_ENDPOINT/v1/chat/completions',
    apiKey: 'YOUR_API_KEY',
    model: 'gpt-4o',
    maxTokens: 4000,
    temperature: 0.3,
    selectionPollInterval: 1500,
    dialogUrl: 'https://zdzfa.github.io/POC-word-plugin/result-dialog.html',
    mockDelay: 1800
};

// ── ASSISTANTS ──────────────────────────────────────────────
var ASSISTANTS = [
    { id: 'analyse', name: 'Analyse de documents', icon: '\uD83D\uDD0D', description: 'Risques, points d\'attention, questions', color: '#0078D4', resultTemplate: 'structured' },
    { id: 'correction', name: 'Correction', icon: '\u270F\uFE0F', description: 'Orthographe, grammaire, typographie', color: '#107C10', resultTemplate: 'diff' },
    { id: 'relecture_forme', name: 'Relecture forme', icon: '\uD83D\uDCDD', description: 'Style, lisibilit\u00e9, structure', color: '#008B8B', resultTemplate: 'annotated' },
    { id: 'relecture_fond', name: 'Relecture fond', icon: '\uD83C\uDFAF', description: 'Substance, rigueur, coh\u00e9rence', color: '#E97025', resultTemplate: 'structured' },
    { id: 'cr_entretien', name: 'CR d\'entretien', icon: '\uD83D\uDCCB', description: 'Notes brutes \u2192 CR structur\u00e9', color: '#5C2D91', resultTemplate: 'report' },
    { id: 'synthese', name: 'Synth\u00e8se', icon: '\uD83D\uDCCA', description: 'R\u00e9sum\u00e9 ex\u00e9cutif, points cl\u00e9s', color: '#7B2FF2', resultTemplate: 'summary' },
    { id: 'homogeneisation', name: 'Homog\u00e9n\u00e9isation', icon: '\uD83D\uDD04', description: 'Harmoniser terminologie et ton', color: '#0099BC', resultTemplate: 'annotated' },
    { id: 'anonymisation', name: 'Anonymisation', icon: '\uD83D\uDEE1\uFE0F', description: 'RGPD : personnes, entit\u00e9s, lieux', color: '#D13438', resultTemplate: 'diff' },
    { id: 'acronymes', name: 'Extraction acronymes', icon: '\uD83D\uDCD6', description: 'Glossaire tabul\u00e9 alphab\u00e9tique', color: '#CA5010', resultTemplate: 'table' }
];

var AppState = {

// ── API MODULE ──────────────────────────────────────────────
var API = {
    call: function(assistantId, userText, instructions) {
        if (CONFIG.useMock) {
            return API.mockCall(assistantId);
        }
        return API.realCall(assistantId, userText, instructions);
    },

    mockCall: function(assistantId) {
        return new Promise(function(resolve) {
            setTimeout(function() {
                resolve({
                    html: MOCK_RESPONSES[assistantId] || '<p>R\u00e9ponse de l\'assistant <strong>' + assistantId + '</strong>.</p>',
                    plain: 'R\u00e9ponse mock pour ' + assistantId
                });
            }, CONFIG.mockDelay);
        });
    },

    realCall: function(assistantId, userText, instructions) {
        var systemPrompt = PROMPTS[assistantId] || '';
        var userMessage = userText;
        if (instructions) {
            userMessage += '\n\n--- Instructions suppl\u00e9mentaires ---\n' + instructions;
        }

        return fetch(CONFIG.apiEndpoint, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + CONFIG.apiKey
            },
            body: JSON.stringify({
                model: CONFIG.model,
                max_tokens: CONFIG.maxTokens,
                temperature: CONFIG.temperature,
                messages: [
                    { role: 'system', content: systemPrompt },
                    { role: 'user', content: userMessage }
                ]
            })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            var text = data.choices && data.choices[0] && data.choices[0].message
                ? data.choices[0].message.content
                : 'Erreur : r\u00e9ponse inattendue de l\'API.';
            return { html: UI.markdownToHtml(text), plain: text };
        })
        .catch(function(err) {
            return { html: '<p style="color:var(--error)">Erreur API : ' + err.message + '</p>', plain: 'Erreur: ' + err.message };
        });
    }
};

// ── WORD API MODULE ─────────────────────────────────────────
var WordAPI = {
    getSelection: function() {
        return Word.run(function(context) {
            var sel = context.document.getSelection();
            sel.load('text');
            return context.sync().then(function() {
                return sel.text || '';
            });
        }).catch(function() { return ''; });
    },

    insertAfterSelection: function(html) {
        return Word.run(function(context) {
            var sel = context.document.getSelection();
            sel.insertHtml('<br/>' + html, Word.InsertLocation.after);
            return context.sync();
        });
    },

    replaceSelection: function(text) {
        return Word.run(function(context) {
            var sel = context.document.getSelection();
            sel.insertText(text, Word.InsertLocation.replace);
            return context.sync();
        });
    },

    startPolling: function() {
        WordAPI.stopPolling();
        WordAPI.pollOnce();
        AppState.pollingTimer = setInterval(WordAPI.pollOnce, CONFIG.selectionPollInterval);
    },

    stopPolling: function() {
        if (AppState.pollingTimer) {
            clearInterval(AppState.pollingTimer);
            AppState.pollingTimer = null;
        }
    },

    pollOnce: function() {
        WordAPI.getSelection().then(function(text) {
            if (text !== AppState.selectedText) {
                AppState.selectedText = text;
                UI.updateSelectionPreview();
                UI.updateSendButton();
            }
        });
    }
};

// ── DIALOG MANAGER ──────────────────────────────────────────
var DialogManager = {
    open: function(data) {
        if (AppState.dialog) {
            try { AppState.dialog.close(); } catch(e) {}
            AppState.dialog = null;
        }

        Office.context.ui.displayDialogAsync(
            CONFIG.dialogUrl,
            { height: 75, width: 65, displayInIframe: false },
            function(result) {
                if (result.status === Office.AsyncResultStatus.Failed) {
                    UI.showToast('Impossible d\'ouvrir la fen\u00eatre', 'error');
                    return;
                }
                AppState.dialog = result.value;

                AppState.dialog.addEventHandler(
                    Office.EventType.DialogMessageReceived,
                    function(arg) { DialogManager.handleMessage(arg); }
                );

                AppState.dialog.addEventHandler(
                    Office.EventType.DialogEventReceived,
                    function() { AppState.dialog = null; }
                );

                // Send data after dialog is ready (small delay)
                setTimeout(function() {
                    if (AppState.dialog) {
                        AppState.dialog.messageChild(JSON.stringify(data));
                    }
                }, 800);
            }
        );
    },

    handleMessage: function(arg) {
        try {
            var msg = JSON.parse(arg.message);
            if (msg.action === 'insert') {
                Handlers.doInsert();
            } else if (msg.action === 'replace') {
                Handlers.doReplace();
            } else if (msg.action === 'copy') {
                Handlers.doCopy();
            } else if (msg.action === 'close') {
                if (AppState.dialog) {
                    try { AppState.dialog.close(); } catch(e) {}
                    AppState.dialog = null;
                }
            }
        } catch(e) {
            console.error('Dialog message error:', e);
        }
    }
};

                html += '<button class="msg-action-btn" onclick="Handlers.regenerate()" title="Reg\u00e9n\u00e9rer la r\u00e9ponse">\uD83D\uDD01 Reg\u00e9n\u00e9rer</button>';
                html += '</div>';
                html += '</div></div>';

    showLoading: function() {
        var container = document.getElementById('chatMessages');
        var loadingHtml = '<div class="loading-indicator" id="loadingMsg">'
            + '<div class="loading-dots"><span></span><span></span><span></span></div>'
            + 'Analyse en cours...'
            + '</div>';
        container.insertAdjacentHTML('beforeend', loadingHtml);
        UI.scrollToBottom();
    },

    hideLoading: function() {
        var el = document.getElementById('loadingMsg');
        if (el) el.remove();
    },

    updateSelectionPreview: function() {
        var content = document.getElementById('selectionContent');
        var stats = document.getElementById('selectionStats');
        var text = AppState.selectedText;

        if (!text || text.trim() === '') {
            content.className = 'selection-empty';
            content.textContent = 'S\u00e9lectionnez du texte dans Word...';
            stats.textContent = '';
        } else {
            content.className = 'selection-text';
            content.textContent = text.length > 300 ? text.substring(0, 300) + '...' : text;
            var words = text.trim().split(/\s+/).length;
            stats.textContent = words + ' mots \u00b7 ' + text.length + ' car.';
        }
    },

    updateSendButton: function() {
        var btn = document.getElementById('btnSend');
        btn.disabled = !AppState.selectedText || AppState.selectedText.trim() === '' || AppState.isLoading;
    },

    scrollToBottom: function() {
        var container = document.getElementById('chatMessages');
        setTimeout(function() {
            container.scrollTop = container.scrollHeight;
        }, 50);
    },

    showToast: function(message, type) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' toast-' + type : '');
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() {
            if (toast.parentNode) toast.remove();
        }, 3000);
    },

    escapeHtml: function(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    },

    stripHtml: function(html) {
        var div = document.createElement('div');
        div.innerHTML = html;
        return div.textContent || div.innerText || '';
    },

    markdownToHtml: function(text) {
        // Basic markdown conversion for real API responses
        var html = text
            .replace(/### (.*)/g, '<h3>$1</h3>')
            .replace(/## (.*)/g, '<h3>$1</h3>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n- /g, '</li><li>')
            .replace(/\n\d+\. /g, '</li><li>');

        if (html.indexOf('<li>') > -1 && html.indexOf('<ul>') === -1) {
            html = html.replace(/<\/li><li>/g, '</li><li>');
            html = '<ul><li>' + html + '</li></ul>';
        }

        return '<p>' + html + '</p>';
    }
};

// ── HANDLERS ────────────────────────────────────────────────
var Handlers = {
    selectAssistant: function(id) {
        var assistant = ASSISTANTS.find(function(a) { return a.id === id; });
        if (!assistant) return;

        AppState.currentAssistant = assistant;
        AppState.messages = [];
        UI.showChatView(assistant);
        WordAPI.startPolling();
    },

    goBack: function() {
        AppState.currentAssistant = null;
        AppState.messages = [];
        AppState.lastResponseHtml = '';
        AppState.lastResponsePlain = '';
        WordAPI.stopPolling();
        UI.showGridView();
    },

    clearChat: function() {
        AppState.messages = [];
        AppState.lastResponseHtml = '';
        AppState.lastResponsePlain = '';
        UI.renderMessages();
        UI.showToast('Conversation effac\u00e9e');
    },

    submit: function() {
        if (!AppState.currentAssistant || !AppState.selectedText || AppState.selectedText.trim() === '') {
            UI.showToast('S\u00e9lectionnez d\'abord du texte dans Word', 'error');
            return;
        }
        if (AppState.isLoading) return;

        var instructions = document.getElementById('inputText').value.trim();
        var text = AppState.selectedText;

        // Add user message
        AppState.messages.push({
            role: 'user',
            selection: text,
            instructions: instructions
        });

        AppState.isLoading = true;
        UI.renderMessages();
        UI.showLoading();
        UI.updateSendButton();
        document.getElementById('inputText').value = '';

        API.call(AppState.currentAssistant.id, text, instructions).then(function(result) {
            AppState.isLoading = false;
            UI.hideLoading();

            AppState.lastResponseHtml = result.html;
            AppState.lastResponsePlain = result.plain || UI.stripHtml(result.html);

            AppState.messages.push({
                role: 'ai',
                content: result.html
            });

            UI.renderMessages();
            UI.scrollToBottom();
            UI.updateSendButton();
        });
    },

    doInsert: function() {
        if (!AppState.lastResponseHtml) {
            UI.showToast('Aucun r\u00e9sultat \u00e0 ins\u00e9rer', 'error');
            return;
        }
        WordAPI.insertAfterSelection(AppState.lastResponseHtml).then(function() {
            UI.showToast('Texte ins\u00e9r\u00e9 dans le document', 'success');
        }).catch(function() {
            UI.showToast('Erreur lors de l\'insertion', 'error');
        });
    },

    doReplace: function() {
        if (!AppState.lastResponsePlain) {
            UI.showToast('Aucun r\u00e9sultat pour le remplacement', 'error');
            return;
        }
        WordAPI.replaceSelection(AppState.lastResponsePlain).then(function() {
            UI.showToast('S\u00e9lection remplac\u00e9e', 'success');
        }).catch(function() {
            UI.showToast('Erreur lors du remplacement', 'error');
        });
    },

    doCopy: function() {
        var text = AppState.lastResponsePlain || '';
        if (!text) {
            UI.showToast('Aucun r\u00e9sultat \u00e0 copier', 'error');
            return;
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                UI.showToast('Copi\u00e9 dans le presse-papiers', 'success');
            }).catch(function() {
                Handlers.fallbackCopy(text);
            });
        } else {
            Handlers.fallbackCopy(text);
        }
    },

    fallbackCopy: function(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            UI.showToast('Copi\u00e9 dans le presse-papiers', 'success');
        } catch(e) {
            UI.showToast('Impossible de copier', 'error');
        }
        document.body.removeChild(ta);
    },

    openInWindow: function() {
        if (!AppState.lastResponseHtml || !AppState.currentAssistant) return;

        var data = {
            assistantName: AppState.currentAssistant.name,
            assistantIcon: AppState.currentAssistant.icon,
            assistantColor: AppState.currentAssistant.color,
            resultHtml: AppState.lastResponseHtml,
            sourceText: AppState.selectedText ? (AppState.selectedText.length > 500 ? AppState.selectedText.substring(0, 500) + '...' : AppState.selectedText) : ''
        };
        DialogManager.open(data);
    },

    regenerate: function() {
        // Remove last AI response and resubmit
        if (AppState.messages.length < 2) return;

        // Find the last user message
        var lastUserMsg = null;
        for (var i = AppState.messages.length - 1; i >= 0; i--) {
            if (AppState.messages[i].role === 'user') {
                lastUserMsg = AppState.messages[i];
                break;
            }
        }
        if (!lastUserMsg) return;

        // Remove last AI message
        if (AppState.messages[AppState.messages.length - 1].role === 'ai') {
            AppState.messages.pop();
        }

        AppState.isLoading = true;
        UI.renderMessages();
        UI.showLoading();
        UI.updateSendButton();

        API.call(AppState.currentAssistant.id, lastUserMsg.selection, lastUserMsg.instructions).then(function(result) {
            AppState.isLoading = false;
            UI.hideLoading();

            AppState.lastResponseHtml = result.html;
            AppState.lastResponsePlain = result.plain || UI.stripHtml(result.html);

            AppState.messages.push({
                role: 'ai',
                content: result.html
            });

            UI.renderMessages();
            UI.scrollToBottom();
            UI.updateSendButton();
        });
    }
};

// ── INITIALIZATION ──────────────────────────────────────────
Office.onReady(function(info) {
    if (info.host === Office.HostType.Word) {
        UI.init();

        document.getElementById('btnBack').onclick = Handlers.goBack;
        document.getElementById('btnClear').onclick = Handlers.clearChat;
        document.getElementById('btnSend').onclick = Handlers.submit;

        var inputText = document.getElementById('inputText');
        inputText.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                Handlers.submit();
            }
        });

        // Auto-resize textarea
        inputText.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 80) + 'px';
        });
    }
});
</script>
