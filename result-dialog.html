<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R&eacute;sultat — Audit IA Copilot</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
        :root {
            --primary: #7B2FF2;
            --primary-light: #EDE4FF;
            --primary-dark: #5A1FBF;
            --primary-bg: #F6F1FF;
            --bg: #FAFAFA;
            --surface: #FFFFFF;
            --text: #242424;
            --text-secondary: #616161;
            --text-muted: #9E9E9E;
            --border: #E0E0E0;
            --border-light: #F0F0F0;
            --success: #107C10;
            --success-bg: #DFF6DD;
            --warning: #FFB900;
            --error: #D13438;
            --error-bg: #FDE7E9;
            --info: #0078D4;
            --info-bg: #D0E7F8;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --font: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .dialog-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .dialog-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dialog-header-icon {
            font-size: 22px;
        }
        .dialog-header-title {
            font-size: 16px;
            font-weight: 600;
        }
        .dialog-close-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .dialog-close-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* Content */
        .dialog-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
        }

        /* Source text section */
        .source-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            margin-bottom: 16px;
        }
        .source-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .source-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            max-height: 100px;
            overflow-y: auto;
        }

        /* Result section */
        .result-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
        }
        .result-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Reuse result content styles from taskpane */
        .result-content { line-height: 1.7; font-size: 14px; }
        .result-content h3 {
            font-size: 15px;
            margin: 14px 0 8px;
            color: var(--primary-dark);
        }
        .result-content h3:first-child { margin-top: 0; }
        .result-content p { margin: 6px 0; }
        .result-content ul, .result-content ol {
            padding-left: 22px;
            margin: 6px 0;
        }
        .result-content li { margin: 3px 0; }
        .result-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 13px;
        }
        .result-content table th {
            background: var(--primary-light);
            color: var(--primary-dark);
            font-weight: 600;
            text-align: left;
            padding: 8px 12px;
            border: 1px solid var(--border);
        }
        .result-content table td {
            padding: 7px 12px;
            border: 1px solid var(--border);
        }
        .result-content table tr:nth-child(even) td {
            background: #FAFAFA;
        }

        .diff-del {
            background: #FECDD3;
            color: #9F1239;
            text-decoration: line-through;
            padding: 1px 3px;
            border-radius: 3px;
        }
        .diff-ins {
            background: #BBF7D0;
            color: #166534;
            padding: 1px 3px;
            border-radius: 3px;
            font-weight: 500;
        }

        .section-block {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin: 10px 0;
            overflow: hidden;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: #F8F8F8;
            font-weight: 600;
            font-size: 13px;
            gap: 8px;
        }
        .section-header .badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            font-weight: 600;
            color: white;
            white-space: nowrap;
        }
        .badge-critical { background: var(--error); }
        .badge-major { background: #E97025; }
        .badge-moderate { background: var(--warning); color: #333; }
        .badge-minor { background: var(--info); }
        .badge-ok { background: var(--success); }
        .section-body {
            padding: 10px 14px;
            font-size: 13px;
            border-top: 1px solid var(--border);
        }

        .exec-summary {
            background: var(--primary-bg);
            border: 1px solid #D4C4F0;
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 12px;
        }
        .exec-summary-title {
            font-weight: 700;
            font-size: 13px;
            color: var(--primary-dark);
            margin-bottom: 4px;
        }

        .report-meta {
            background: #F5F5F5;
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .report-meta-row {
            display: flex;
            gap: 8px;
            padding: 2px 0;
        }
        .report-meta-label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 80px;
        }

        .annotation-block {
            border-left: 3px solid var(--info);
            background: var(--info-bg);
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 0 var(--radius) var(--radius) 0;
            font-size: 13px;
        }
        .annotation-block.improved {
            border-left-color: var(--success);
            background: var(--success-bg);
        }
        .annotation-label {
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .score-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 24px;
            font-weight: 700;
            color: var(--primary);
            margin: 8px 0;
        }
        .score-display .score-label {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        /* Footer actions */
        .dialog-footer {
            border-top: 1px solid var(--border);
            background: var(--surface);
            padding: 14px 24px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .dialog-btn {
            padding: 8px 18px;
            border-radius: var(--radius);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .dialog-btn-primary {
            background: var(--primary);
            color: white;
            border: none;
        }
        .dialog-btn-primary:hover { background: var(--primary-dark); }
        .dialog-btn-secondary {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .dialog-btn-secondary:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        .dialog-btn-close {
            background: none;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            margin-left: auto;
        }
        .dialog-btn-close:hover {
            background: var(--error-bg);
            border-color: var(--error);
            color: var(--error);
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 70px;
            left: 24px;
            right: 24px;
            z-index: 1000;
            pointer-events: none;
        }
        .toast {
            background: #333;
            color: white;
            padding: 10px 16px;
            border-radius: var(--radius);
            font-size: 13px;
            margin-top: 6px;
            animation: toastIn 0.25s ease, toastOut 0.3s ease 2.5s forwards;
            pointer-events: auto;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .toast.toast-success { background: var(--success); }
        .toast.toast-error { background: var(--error); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }

        /* Loading state */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CCC; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #AAA; }
    </style>
</head>
<body>

    <div class="dialog-header">
        <div class="dialog-header-left">
            <span class="dialog-header-icon" id="headerIcon"></span>
            <span class="dialog-header-title" id="headerTitle">R&eacute;sultat</span>
        </div>
        <button class="dialog-close-btn" id="btnClose" title="Fermer">&times;</button>
    </div>

    <div class="dialog-body" id="dialogBody">
        <div class="loading-state" id="loadingState">
            <div class="spinner"></div>
            <span>Chargement du r&eacute;sultat...</span>
        </div>

        <div id="contentArea" style="display:none;">
            <div class="source-section" id="sourceSection" style="display:none;">
                <div class="source-label">Texte source (extrait)</div>
                <div class="source-text" id="sourceText"></div>
            </div>

            <div class="result-section">
                <div class="result-label" id="resultLabel">R&eacute;sultat de l'analyse</div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <div class="dialog-footer" id="dialogFooter" style="display:none;">
        <button class="dialog-btn dialog-btn-primary" id="btnInsert">&#10133; Ins&eacute;rer dans le document</button>
        <button class="dialog-btn dialog-btn-secondary" id="btnReplace">&#128260; Remplacer la s&eacute;lection</button>
        <button class="dialog-btn dialog-btn-secondary" id="btnCopy">&#128203; Copier</button>
        <button class="dialog-btn dialog-btn-close" id="btnCloseFooter">Fermer</button>
    </div>

    <div class="toast-container" id="toastContainer"></div>

<script>
/* =============================================================
   RESULT DIALOG — Audit IA Copilot
   ============================================================= */

var DialogApp = {
    data: null,

    init: function() {
        // Button handlers
        document.getElementById('btnClose').onclick = DialogApp.close;
        document.getElementById('btnCloseFooter').onclick = DialogApp.close;
        document.getElementById('btnInsert').onclick = function() { DialogApp.sendAction('insert'); };
        document.getElementById('btnReplace').onclick = function() { DialogApp.sendAction('replace'); };
        document.getElementById('btnCopy').onclick = DialogApp.copyToClipboard;

        // Listen for messages from parent
        Office.context.ui.addHandlerAsync(
            Office.EventType.DialogParentMessageReceived,
            DialogApp.onParentMessage
        );
    },

    onParentMessage: function(arg) {
        try {
            var data = JSON.parse(arg.message);
            DialogApp.data = data;
            DialogApp.render(data);
        } catch(e) {
            console.error('Failed to parse parent message:', e);
            document.getElementById('loadingState').innerHTML =
                '<p style="color:var(--error);">Erreur de chargement des donn\u00e9es.</p>';
        }
    },

    render: function(data) {
        // Hide loading, show content
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('contentArea').style.display = 'block';
        document.getElementById('dialogFooter').style.display = 'flex';

        // Header
        if (data.assistantIcon) {
            document.getElementById('headerIcon').textContent = data.assistantIcon;
        }
        if (data.assistantName) {
            document.getElementById('headerTitle').textContent = data.assistantName;
        }

        // Source text
        if (data.sourceText && data.sourceText.trim()) {
            document.getElementById('sourceSection').style.display = 'block';
            document.getElementById('sourceText').textContent = data.sourceText;
        }

        // Result
        document.getElementById('resultContent').innerHTML = data.resultHtml || '<p>Aucun r\u00e9sultat disponible.</p>';

        // Apply header color
        if (data.assistantColor) {
            document.querySelector('.dialog-header').style.background =
                'linear-gradient(135deg, ' + data.assistantColor + ' 0%, ' + DialogApp.darkenColor(data.assistantColor) + ' 100%)';
        }
    },

    sendAction: function(action) {
        Office.context.ui.messageParent(JSON.stringify({ action: action }));
        DialogApp.showToast(
            action === 'insert' ? 'Insertion demand\u00e9e...' :
            action === 'replace' ? 'Remplacement demand\u00e9...' :
            'Action envoy\u00e9e...', 'success'
        );
    },

    close: function() {
        Office.context.ui.messageParent(JSON.stringify({ action: 'close' }));
    },

    copyToClipboard: function() {
        var content = document.getElementById('resultContent');
        var text = content.textContent || content.innerText || '';
        if (!text) {
            DialogApp.showToast('Rien \u00e0 copier', 'error');
            return;
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function() {
                DialogApp.showToast('Copi\u00e9 dans le presse-papiers', 'success');
            }).catch(function() {
                DialogApp.fallbackCopy(text);
            });
        } else {
            DialogApp.fallbackCopy(text);
        }
    },

    fallbackCopy: function(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            DialogApp.showToast('Copi\u00e9 dans le presse-papiers', 'success');
        } catch(e) {
            DialogApp.showToast('Impossible de copier', 'error');
        }
        document.body.removeChild(ta);
    },

    showToast: function(message, type) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast' + (type ? ' toast-' + type : '');
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(function() {
            if (toast.parentNode) toast.remove();
        }, 3000);
    },

    darkenColor: function(hex) {
        var r = parseInt(hex.slice(1,3), 16);
        var g = parseInt(hex.slice(3,5), 16);
        var b = parseInt(hex.slice(5,7), 16);
        r = Math.max(0, Math.floor(r * 0.7));
        g = Math.max(0, Math.floor(g * 0.7));
        b = Math.max(0, Math.floor(b * 0.7));
        return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
    }
};

Office.onReady(function() {
    DialogApp.init();
});
</script>

</body>
</html>
